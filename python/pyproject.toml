[project]
name = "smoothdiff-torch"
version = "0.1.0"
description = "SmoothDiff for PyTorch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.1",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "ruff>=0.8",
]
examples = [
    "cmcrameri>=1.9",
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.3",
    "numpy>=2.3.2",
    "pillow>=11.3.0",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
]

[tool.pytest.ini_options]
addopts = "--tb=short -q --no-header"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["examples"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "D",        # pydocstyle
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "ICN",      # flake8-import-conventions
    "PIE",      # flake8-pie
    "PT",       # flake8-pytest-style
    "RSE",      # flake8-raise
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "T20",      # flake8-print
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # pyflakes
    "I",        # isort
    "PERF",     # perflint
    "PLC0415",  # prohibit imports outside of top-level
    "RUF",      # ruff-specific rules
    "UP",       # pyupgrade
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"